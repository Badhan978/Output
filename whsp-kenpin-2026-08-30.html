const LSKEY = "review_" + PAGE;
let state = {};
try{ state = JSON.parse(localStorage.getItem(LSKEY) || "{}"); }catch(e){ state = {}; }

const main = document.getElementById("main");
const toc = document.getElementById("toc");
document.getElementById("ptotal").textContent = ITEMS.length;

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

ITEMS.forEach(item=>{
  const sec = document.createElement("section");
  sec.className = "item"; sec.id = item.id;
  const vids = item.videos.map(([f,label])=>{
    let media;
    if(String(f).startsWith("drive:")){
      media = `<iframe class="dframe" loading="lazy" src="https://drive.google.com/file/d/${encodeURIComponent(f.slice(6))}/preview" allow="autoplay" allowfullscreen></iframe>`;
    }else if(String(f).startsWith("folder:")){
      media = `<iframe class="dframe wide" loading="lazy" src="https://drive.google.com/embeddedfolderview?id=${encodeURIComponent(f.slice(7))}#grid"></iframe>`;
    }else{
      media = `<video controls preload="metadata" src="${DIR}${encodeURIComponent(f)}"></video>`;
    }
    return `<div class="vbox">${media}<div class="vlabel">${esc(label)}</div></div>`;
  }).join("");
  const cmp = item.compare ? `
    <details class="cmp"><summary>参考実物と並べる（クリックで展開）</summary>
    <img loading="lazy" src="${DIR}${encodeURIComponent(item.compare)}"></details>` : "";
  const qs = item.qs.map(q=>{
    const opts = q.opts.map(o=>`<div class="opt" data-item="${esc(item.id)}" data-q="${esc(q.k)}" data-v="${esc(o)}" data-multi="${q.multi?1:0}" data-style="${q.style&&q.style[o]?q.style[o]:""}">${esc(o)}</div>`).join("");
    return `<div class="qname">${esc(q.k)}</div><div class="opts">${opts}</div>`;
  }).join("");
  sec.innerHTML = `
    <div class="head"><span class="chip">${esc(item.id)}</span><h2>${esc(item.title)}</h2>
      <span class="dur">${esc(item.dur)}</span><span class="statepill" id="st-${esc(item.id)}">未判定</span></div>
    <div class="body">
      <div class="media">${vids}${cmp}</div>
      <div class="panel">
        <div class="ctx">${item.ctx}</div>
        ${qs}
        <textarea id="memo-${esc(item.id)}" placeholder="メモ（修正指示・気になった点など。自由記入）"></textarea>
      </div>
    </div>`;
  main.appendChild(sec);
  const a = document.createElement("a");
  a.href = "#"+item.id; a.id = "toc-"+item.id; a.textContent = item.id;
  toc.appendChild(a);
});

function refresh(){
  let answered = 0;
  ITEMS.forEach(item=>{
    const s = state[item.id] || {};
    document.querySelectorAll(`.opt[data-item="${item.id}"]`).forEach(el=>{
      const q = el.dataset.q, v = el.dataset.v;
      const cur = s[q];
      const on = el.dataset.multi==="1" ? Array.isArray(cur)&&cur.includes(v) : cur===v;
      el.classList.toggle("sel", !!on);
      el.classList.toggle("go", !!on && el.dataset.style==="go");
      el.classList.toggle("fix", !!on && el.dataset.style==="fix");
    });
    const memoEl = document.getElementById("memo-"+item.id);
    if(document.activeElement !== memoEl) memoEl.value = s.メモ || "";
    const done = !!s["判定"];
    if(done) answered++;
    const st = document.getElementById("st-"+item.id);
    st.textContent = done ? s["判定"] : "未判定";
    st.className = "statepill" + (done?" on":"");
    document.getElementById("toc-"+item.id).className = done ? "done" : "";
  });
  document.getElementById("pnum").textContent = answered;
  document.getElementById("pfill").style.width = (answered/ITEMS.length*100)+"%";
}

function persist(){ localStorage.setItem(LSKEY, JSON.stringify(state)); refresh(); }

document.addEventListener("click", e=>{
  const el = e.target.closest(".opt"); if(!el) return;
  const {item:id, q, v} = el.dataset;
  state[id] = state[id] || {};
  if(el.dataset.multi==="1"){
    const arr = Array.isArray(state[id][q]) ? state[id][q] : [];
    state[id][q] = arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v];
  }else{
    state[id][q] = (state[id][q]===v) ? undefined : v;
  }
  persist();
});
document.addEventListener("input", e=>{
  if(!e.target.matches("textarea")) return;
  const id = e.target.id.replace("memo-","");
  state[id] = state[id] || {};
  state[id].メモ = e.target.value;
  localStorage.setItem(LSKEY, JSON.stringify(state));
});

function buildMarkdown(){
  const lines = ["# 判定結果: " + PAGE, ""];
  ITEMS.forEach(item=>{
    const s = state[item.id] || {};
    lines.push(`## ${item.id} ${item.title}`);
    item.qs.forEach(q=>{
      const v = s[q.k];
      const txt = Array.isArray(v) ? (v.length?v.join("・"):"（未選択）") : (v || "（未選択）");
      lines.push(`- ${q.k}: ${txt}`);
    });
    if(s.メモ && s.メモ.trim()) lines.push(`- メモ: ${s.メモ.trim()}`);
    lines.push("");
  });
  return lines.join("\n");
}

if(ENDPOINT){
  document.getElementById("revwrap").hidden = false;
  document.getElementById("savedest").textContent = "、判定が回収シートに送信されます";
  const rv = document.getElementById("reviewer");
  try{ rv.value = localStorage.getItem("reviewer_name") || ""; }catch(e){}
  rv.addEventListener("input", ()=>{ try{ localStorage.setItem("reviewer_name", rv.value); }catch(e){} });
}

function buildRows(){
  return ITEMS.map(item=>{
    const s = state[item.id] || {};
    const checks = item.qs.filter(q=>q.multi)
      .map(q=>Array.isArray(s[q.k]) ? s[q.k].join("・") : "").filter(Boolean).join(" / ");
    return {id: item.id, judge: s["判定"] || "", checks, memo: (s.メモ||"").trim()};
  }).filter(r=>r.judge || r.checks || r.memo);
}

document.getElementById("savebtn").addEventListener("click", async ()=>{
  const btn = document.getElementById("savebtn"), msg = document.getElementById("savemsg");
  btn.disabled = true; msg.textContent = "保存中…"; msg.className = "savemsg";
  try{
    let j;
    if(ENDPOINT){
      const res = await fetch(ENDPOINT, {method:"POST",
        body: JSON.stringify({page: PAGE, reviewer: document.getElementById("reviewer").value.trim(), rows: buildRows()})});
      j = await res.json();
      if(j.ok){ msg.textContent = `送信しました（${j.n}件）`; msg.className = "savemsg ok"; }
      else throw new Error("save failed");
    }else{
      const res = await fetch("/save", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({page: PAGE, markdown: buildMarkdown(), answers: state})});
      j = await res.json();
      if(j.ok){ msg.textContent = "保存しました "+j.saved_at; msg.className = "savemsg ok"; }
      else throw new Error(j.error||"save failed");
    }
  }catch(err){
    msg.textContent = ENDPOINT ? "送信失敗: 回線かendpointを確認" : "保存失敗: サーバー停止中かも";
    msg.className = "savemsg err";
  }
  btn.disabled = false;
});

refresh();
</script>
